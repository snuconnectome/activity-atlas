name: Build Activity Atlas

# Strategy: CI renders the site from the redacted JSON in data/pub/ that is
# already committed. It never touches raw commit data.
#
# The whole Python pipeline runs LOCALLY:
#  - fetch_commits.py needs a broad-scope token (admin:org+repo), unsafe as a
#    workflow secret
#  - topic_model.py + weekly_pulse.py need full commit message bodies, and
#    those deliberately never enter the repo (scripts/redact.py)
#
# Refresh with:
#   python scripts/fetch_commits.py && python scripts/topic_model.py \
#     && python scripts/weekly_pulse.py && python scripts/redact.py
#   git add data/pub/ && git commit && git push
#
# What CI DOES do: guard against raw data leaking in, then Quarto render →
# deploy to GitHub Pages.

on:
  schedule:
    # Every Monday 08:00 UTC = 17:00 KST
    - cron: "0 8 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.qmd"
      - "_quarto.yml"
      - "assets/**"
      - "data/pub/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Opt-in to Node 24 ahead of June 2026 default migration
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fails the build rather than the privacy guarantee: if raw commit data
      # is ever committed by mistake, nothing gets deployed.
      - name: Guard — no raw commit data in repo
        run: |
          if [ -e data/raw ]; then
            echo "::error::data/raw/ is present in the repo. Raw commit bodies must stay local (see scripts/redact.py)."
            exit 1
          fi
          if grep -rlq '"message"' data/pub/ 2>/dev/null; then
            echo "::error::data/pub/ contains a 'message' field. Run scripts/redact.py."
            exit 1
          fi
          test -f data/pub/commits_slim.json || { echo "::error::data/pub/commits_slim.json missing."; exit 1; }

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Quarto render
        run: quarto render

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
